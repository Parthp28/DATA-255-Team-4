# E3 -- ResNet-18 rendering-consistency intervention: paired CE + lambda * JS.
# lambda is selected on validation (D13) from {0.3, 1, 3}; 1.0 shown here.
experiment_id: E3
model: resnet18.a1_in1k
seed: 0
phase: dev
data_version: data_v1
render_version: render_v1
train_renders: [R0, R1, R2, R4]
pairing: pair_distinct
loss: ce_plus_js
consistency_lambda: 1.0
lr: 3.0e-4
weight_decay: 0.05
images_per_step: 128
epochs_max: 10
patience: 3
early_stop_metric: val_macro_f1_own_renders
amp: true
grad_clip: 1.0
image_size: 224
frozen: false

# E4 -- DeiT-S/16 rendering-consistency intervention: paired CE + lambda * JS (owner: Khushi).
# lambda candidates {0.3, 1, 3} on validation, seed 0 (--set consistency_lambda=..., --inherit configs/frozen/E2.yaml);
# selected by scripts/select_lambda.py (D13). 1.0 shown here; lr/wd are placeholders replaced by --inherit.
experiment_id: E4
model: deit_small_patch16_224.fb_in1k
seed: 0
phase: dev
data_version: data_v1
render_version: render_v1
train_renders: [R0, R1, R2, R4]
pairing: pair_distinct
loss: ce_plus_js
consistency_lambda: 1.0
lr: 1.0e-4
weight_decay: 0.05
images_per_step: 128
epochs_max: 10
patience: 3
early_stop_metric: val_macro_f1_own_renders
amp: true
grad_clip: 1.0
image_size: 224
frozen: false
